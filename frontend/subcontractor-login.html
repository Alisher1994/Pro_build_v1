<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход для субподрядчика · ProBIM</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/e-imzo.js"></script>
    <script src="js/e-imzo-client.js"></script>
    <style>
        :root {
            --auth-primary: #2b579a;
            --auth-primary-hover: #1e3f72;
        }

        :root {
            --primary: #2b579a;
            --primary-hover: #1e3f72;
            --white: #ffffff;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-600: #4b5563;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }

        #video-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            opacity: 0.6;
            z-index: -1;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0, 0, 0, 0.4) 100%);
            z-index: -1;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 2rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
            letter-spacing: -0.05em;
        }

        .logo span {
            color: var(--primary);
        }

        .subtitle {
            color: var(--gray-600);
            font-size: 1rem;
            margin-bottom: 2.5rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 0.5rem;
            margin-left: 0.25rem;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            height: 3.5rem;
            padding: 0 1.25rem;
            border-radius: 1rem;
            border: 1.5px solid var(--gray-200);
            background: var(--white);
            font-size: 1rem;
            font-family: inherit;
            color: var(--gray-900);
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(43, 87, 154, 0.1);
        }

        button {
            width: 100%;
            height: 3.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 1rem;
            font-size: 1.125rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 1rem;
            box-shadow: 0 10px 15px -3px rgba(43, 87, 154, 0.3);
        }

        button:hover {
            background: var(--primary-hover);
            box-shadow: 0 20px 25px -5px rgba(43, 87, 154, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: var(--gray-400);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-message {
            background: #fee2e2;
            color: #b91c1c;
            padding: 1rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            margin-top: 1.5rem;
            display: none;
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }

        .footer-links {
            margin-top: 2rem;
            font-size: 0.875rem;
            color: var(--gray-600);
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        /* --- Logo Text Flip Animation --- */
        .scrolling-text-container {
            display: inline-block;
            height: 1.2em;
            overflow: hidden;
            vertical-align: bottom;
            position: relative;
            width: 170px;
            /* Fixed width to prevent jumping */
            text-align: left;
        }

        .scrolling-text-content {
            display: block;
            position: relative;
            animation: scrollText 20s infinite cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .scrolling-text-item {
            display: block;
            height: 1.2em;
            line-height: 1.2em;
            white-space: nowrap;
        }

        @keyframes scrollText {

            0%,
            10% {
                transform: translateY(0);
            }

            12.5%,
            22.5% {
                transform: translateY(-1.2em);
            }

            25%,
            35% {
                transform: translateY(-2.4em);
            }

            37.5%,
            47.5% {
                transform: translateY(-3.6em);
            }

            50%,
            60% {
                transform: translateY(-4.8em);
            }

            62.5%,
            72.5% {
                transform: translateY(-6.0em);
            }

            75%,
            85% {
                transform: translateY(-7.2em);
            }

            87.5%,
            97.5% {
                transform: translateY(-8.4em);
            }

            100% {
                transform: translateY(0);
            }

            /* Loop back */
        }

        /* Login Methods Styles */
        .login-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.06);
            /* More distinct gray background */
            padding: 0.4rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            gap: 0.25rem;
        }

        .login-tab {
            flex: 1;
            padding: 0.6rem 0.4rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--gray-600);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            background: transparent;
            box-shadow: none;
            margin-top: 0;
            height: auto;
        }

        .login-tab:hover {
            color: var(--white) !important;
            background: var(--primary);
        }

        .login-tab.active {
            background: var(--white);
            color: var(--primary);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08) !important;
        }

        .login-tab.active:hover {
            background: var(--white);
            color: var(--primary) !important;
        }

        .method-content {
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        .method-content.active {
            display: block;
        }

        .pfx-info {
            font-size: 0.85rem;
            color: var(--gray-600);
            background: var(--gray-100);
            padding: 1rem;
            border-radius: 0.75rem;
            margin-bottom: 1rem;
            text-align: left;
        }
    </style>
</head>

<body>
    <video id="video-bg" autoplay muted loop playsinline>
        <source src="src/media/Login.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div class="login-card">
        <div class="logo" style="display: flex; align-items: baseline; justify-content: center; width: 100%;">
            Pro&nbsp;
            <div class="scrolling-text-container" style="color: var(--primary);">
                <div class="scrolling-text-content">
                    <div class="scrolling-text-item">BIM</div>
                    <div class="scrolling-text-item">ESTIMATE</div>
                    <div class="scrolling-text-item">TENDER</div>
                    <div class="scrolling-text-item">PLAN</div>
                    <div class="scrolling-text-item">SUPPLY</div>
                    <div class="scrolling-text-item">MONEY</div>
                    <div class="scrolling-text-item">LOGIC</div>
                    <div class="scrolling-text-item">SALES</div>
                    <div class="scrolling-text-item">BIM</div>
                </div>
            </div>
        </div>
        <div class="subtitle">Модуль субподрядчика</div>

        <!-- Login Method Tabs -->
        <div class="login-tabs">
            <button class="login-tab active" data-method="phone">Телефон</button>
            <button class="login-tab" data-method="pfx">PFX (ЭЦП)</button>
            <button class="login-tab" data-method="email">Почта</button>
        </div>

        <form id="login-form">
            <!-- Phone Method -->
            <div id="method-phone" class="method-content active">
                <div class="form-group">
                    <label for="phone">Номер телефона</label>
                    <input type="tel" id="login-phone" placeholder="+998 (__) ___-__-__">
                </div>
                <div class="form-group">
                    <label for="phone-password">Пароль</label>
                    <input type="password" id="login-phone-password" placeholder="••••••••">
                </div>
            </div>

            <!-- PFX Method -->
            <div id="method-pfx" class="method-content">
                <div class="pfx-info">
                    Для входа необходимо наличие модуля <strong>E-IMZO</strong> и активного ключа.
                </div>
                <div class="form-group">
                    <label>Выберите ключ ЭЦП</label>
                    <div class="custom-select-container">
                        <div class="custom-select-trigger">
                            <span>Выберите ключ...</span>
                        </div>
                        <div class="custom-options-wrapper">
                            <div class="select-search">
                                <input type="text" placeholder="Поиск по имени или ИНН...">
                            </div>
                            <div class="custom-options">
                                <div class="custom-option-loading">Загрузка ключей...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Email Method -->
            <div id="method-email" class="method-content">
                <div class="form-group">
                    <label for="email">Электронная почта</label>
                    <input type="email" id="login-email" placeholder="example@mail.com">
                </div>
                <div class="form-group">
                    <label for="email-password">Пароль</label>
                    <input type="password" id="login-email-password" placeholder="••••••••">
                </div>
            </div>

            <div id="login-error" class="error-message"></div>
            <button type="submit" id="login-btn" style="margin-top: 1rem;">Войти в систему</button>
        </form>

        <div class="footer-links">
            Нет аккаунта? <a href="#">Свяжитесь с менеджером</a>
        </div>
    </div>

    <!-- Centralized Assets -->
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
