      async function renderBlocksWithEstimates() {
        const container = document.getElementById('col-blocks-estimates');
        container.innerHTML = '<div class="muted" style="padding:12px; text-align:center;">Загрузка...</div>';

        try {
          // Fetch all estimates for all blocks
          const blocksWithEstimates = await Promise.all(
            blocksData.map(async (block) => {
              try {
                const estimates = await window.probimApi.getEstimates(block.id);
                return { ...block, estimates: estimates || [] };
              } catch (e) {
                console.error(`Failed to load estimates for block ${block.id}:`, e);
                return { ...block, estimates: [] };
              }
            })
          );

          // Render grouped blocks with their estimates
          container.innerHTML = blocksWithEstimates.map(block => {
            const sortedEstimates = [...block.estimates].sort((a, b) => (a.name || "").localeCompare(b.name || ""));
            const isCollapsed = collapsedBlocks.has(block.id);
            const chevronSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>';
            
            return `
              <div class="block-group" data-block-id="${block.id}">
                <div class="block-group-header ${isCollapsed ? 'collapsed' : ''}" data-block-id="${block.id}">
                  <span class="chevron">${chevronSvg}</span>
                  <span>${block.name}</span>
                </div>
                <div class="block-estimates ${isCollapsed ? 'collapsed' : ''}" data-block-id="${block.id}" style="max-height: ${isCollapsed ? '0' : (sortedEstimates.length * 40 + 20) + 'px'}">
                  ${sortedEstimates.length === 0 ? 
                    '<div class="muted" style="padding:8px 12px 8px 24px; font-size:11px;">Нет разделов</div>' :
                    sortedEstimates.map(est => {
                      const isEmpty = est._count && est._count.sections === 0;
                      return `
                        <div class="estimate-item ${est.id === activeEstimateId ? 'active' : ''} ${isEmpty ? 'disabled' : ''}" 
                             data-block-id="${block.id}"
                             data-estimate-id="${est.id}" 
                             data-estimate-name="${est.name}"
                             ${isEmpty ? 'title="Раздел не содержит данных"' : ''}>
                          ${est.name}
                        </div>
                      `;
                    }).join('')
                  }
                </div>
              </div>
            `;
          }).join('');

          // Attach click handlers to block headers for collapse/expand
          container.querySelectorAll('.block-group-header').forEach(header => {
            header.addEventListener('click', (e) => {
              const blockId = header.dataset.blockId;
              const estimatesContainer = container.querySelector(`.block-estimates[data-block-id="${blockId}"]`);
              
              if (collapsedBlocks.has(blockId)) {
                collapsedBlocks.delete(blockId);
                header.classList.remove('collapsed');
                estimatesContainer.classList.remove('collapsed');
                const itemCount = estimatesContainer.querySelectorAll('.estimate-item, .muted').length;
                estimatesContainer.style.maxHeight = (itemCount * 40 + 20) + 'px';
              } else {
                collapsedBlocks.add(blockId);
                header.classList.add('collapsed');
                estimatesContainer.classList.add('collapsed');
                estimatesContainer.style.maxHeight = '0';
              }
            });
          });

          // Attach click handlers to estimate items
          container.querySelectorAll('.estimate-item:not(.disabled)').forEach(el => {
            el.addEventListener('click', () => {
              activeBlockId = el.dataset.blockId;
              selectEstimate(el.dataset.estimateId, el.dataset.estimateName);
            });
          });
        } catch (e) {
          console.error('Failed to render blocks with estimates:', e);
          container.innerHTML = '<div style="color:red; padding:12px;">Ошибка загрузки данных</div>';
        }
      }

      async function selectEstimate(id, name) {
        if (activeEstimateId === id) return;
        activeEstimateId = id;

        // Update active class in estimates list
        const container = document.getElementById('col-blocks-estimates');
        container.querySelectorAll('.estimate-item').forEach(el => {
          if (el.dataset.estimateId === id) el.classList.add('active');
          else el.classList.remove('active');
        });

        const treeContainer = document.getElementById('col-tree');
        treeContainer.innerHTML = '<div class="muted" style="padding:12px; text-align:center;">Загрузка этапов...</div>';
        activeEstimateName = name;

        try {
          // Fetch Tree Data
          const sections = await window.probimApi.getSections(id);
          // Flatten stages from all sections
          let allStages = [];
          for (const sec of sections) {
            const stages = await window.probimApi.getStages(sec.id);
            allStages = allStages.concat(stages);
          }

          if (allStages.length === 0) {
            treeContainer.innerHTML = '<div class="muted" style="padding:12px; text-align:center;">Нет этапов</div>';
            return;
          }

          // Fetch Work Types for all stages
          const stagesWithWt = await Promise.all(allStages.map(async (stage) => {
            const wts = await window.probimApi.getWorkTypes(stage.id);
            const wtsWithResources = await Promise.all((wts || []).map(async (wt) => {
              let resources = [];
              try {
                resources = await window.probimApi.getResources(wt.id) || [];
                console.log('Resources for WT', wt.id, ':', resources);
              } catch (err) {
                console.warn('Failed to fetch resources for WT', wt.id, err);
              }

              // Calculate totals if missing using resources
              if (!wt.totalCost || wt.totalCost === 0) {
                const total = resources.reduce((sum, r) => sum + (r.totalCost || ((Number(r.quantity) || 0) * (Number(r.unitPrice) || 0))), 0);
                if (total > 0) wt.totalCost = total;
                const qty = Number(wt.quantity || wt.qty || wt.volume || 0);
                if (qty > 0 && (!wt.unitCost || wt.unitCost === 0)) {
                  wt.unitCost = wt.totalCost ? (wt.totalCost / qty) : 0;
                }
              }

              return { ...wt, resources };
            }));

            return { ...stage, wts: wtsWithResources };
          }));

          lotTreeData = stagesWithWt;
          renderTree(lotTreeData, id, name);

        } catch (e) {
          console.error(e);
          treeContainer.innerHTML = '<div style="color:red; padding:12px;">Ошибка загрузки дерева</div>';
        }
      }

      function renderTree(stages, estimateId, estimateName) {
        const container = document.getElementById('col-tree');
        const header = document.getElementById('col-tree-header');
        const blockName = blocksData.find(b => b.id == activeBlockId)?.name;

        if (header && estimateName) {
          header.textContent = `2. Состав работ раздела ${estimateName}`;
        }

        const escapeHtml = (value) => (value ?? '').toString()
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');

        const query = (searchQuery || '').toLowerCase();

        let html = '<div class="tree-grid-header"><span></span><span>№</span><span>Шифр</span><span>Вид работ</span><span>Объем</span><span>Ед. изм.</span><span>Сумма</span></div>';
        stages.forEach(stage => {
          if (!stage.wts || stage.wts.length === 0) return;

          const filteredWts = !query ? stage.wts : stage.wts.filter(wt => {
            const wtHay = [wt.name, wt.cipher, wt.code, wt.itemCode, wt.workCode, wt.article, wt.number]
              .filter(Boolean)
              .map(String)
              .join(' ') 
              .toLowerCase();
            
            if (wtHay.includes(query)) return true;
            
            // Search in resources
            const resources = Array.isArray(wt.resources) ? wt.resources : [];
            const hasMatchingResource = resources.some(res => {
              const resHay = [res.name, res.cipher, res.code, res.resourceCode, res.itemCode, res.article, res.number, res.resourceName, res.title]
                .filter(Boolean)
                .map(String)
                .join(' ')
                .toLowerCase();
              return resHay.includes(query);
            });
            
            return hasMatchingResource;
          });

          if (filteredWts.length === 0) return;

          const wtItems = filteredWts.map((wt, idx) => {
            const isChecked = selectedWorkTypes.has(wt.id);
            const isUsed = usedWorkTypeIds.has(wt.id);
            const volume = wt.volume ?? wt.qty ?? wt.quantity ?? '—';
            const unit = wt.unit ?? wt.uom ?? wt.measure ?? '—';

            const cipherRaw = (wt.cipher || wt.code || wt.itemCode || wt.workCode || wt.article || wt.number || '').toString().trim();
            const cipherDisplay = cipherRaw || '—';
            const cipherSafe = escapeHtml(cipherDisplay);
            const cipherAttr = escapeHtml(cipherRaw);

            const displayNoRaw = (wt.code && String(wt.code).trim().replace(/\.$/, ''))
              || (wt.orderIndex !== undefined ? String(wt.orderIndex + 1) : '')
              || (wt.sequence !== undefined ? String(wt.sequence) : '')
              || String(idx + 1);
            const displayNo = escapeHtml(displayNoRaw || String(idx + 1));

            const itemTotalCost = wt.totalCost || (parseFloat(wt.quantity || 0) * parseFloat(wt.unitCost || 0)) || 0;
            const resources = Array.isArray(wt.resources) ? wt.resources : [];

            return `
                    <div class="tree-wt-row ${isUsed ? 'disabled' : ''}">
                      <div class="tree-wt-check" style="display:flex; align-items:center; justify-content:center;">
                        <input type="checkbox" class="wt-cb" 
                          value="${wt.id}" 
                          ${isChecked ? 'checked' : ''}
                          ${isUsed ? 'disabled' : ''}
                          data-name="${escapeHtml(wt.name)}"
                          data-stage-id="${stage.id}"
                          data-stage-name="${escapeHtml(stage.name)}"
                          data-unit="${escapeHtml(unit)}"
                          data-volume="${escapeHtml(volume)}"
                          data-unit-cost="${wt.unitCost || 0}"
                          data-total-cost="${itemTotalCost}"
                          data-code="${cipherAttr}"
                          data-cipher="${cipherAttr}"
                        >
                      </div>
                      <div class="tree-wt-no">${displayNo}.</div>
                      <div class="tree-wt-code"><span class="code-pill" title="${cipherSafe}">${cipherSafe}</span></div>
                      <label class="tree-wt-item">
                        <span class="wt-name" title="${escapeHtml(wt.name)}">${escapeHtml(wt.name)}</span>
                        ${isUsed ? '<span class="wt-badge">В другом лоте</span>' : ''}
                      </label>
                      <span class="tree-wt-volume">${volume}</span>
                      <span class="tree-wt-unit">${unit}</span>
                      <span class="tree-wt-sum" style="text-align:right; font-weight:600; color:var(--primary);">${formatMoney(itemTotalCost)}</span>
                      ${showResources && resources.length ? `
                        <div class="wt-resources">
                          ${resources.filter(res => {
                            if (resourceTypeFilters.size === 0) return true;
                            const rawType = (res.resourceType || '').toLowerCase();
                            let resType = 'material';
                            if (rawType.includes('labor') || rawType === 'labor') resType = 'labor';
                            else if (rawType.includes('equipment') || rawType === 'equipment') resType = 'equipment';
                            return resourceTypeFilters.has(resType);
                          }).map((res, resIdx) => {
                            const resNoRaw = (res.code && String(res.code).trim().replace(/\.$/, '')) || String(resIdx + 1);
                            const resNo = escapeHtml(resNoRaw);
                            const resCodeRaw = res.cipher || res.resourceCode || res.itemCode || res.article || res.number || '';
                            const resCode = escapeHtml((resCodeRaw || '—').toString());
                            const resNameRaw = res.name || res.resourceName || res.title || res.description || '';
                            const resName = escapeHtml(resNameRaw);
                            const qty = Number(res.quantity || 0);
                            const unitRes = escapeHtml(res.unit || res.measure || '');
                            const resTotal = res.totalCost || (qty * (Number(res.unitPrice) || 0));
                            const normPerUnit = res.normPerUnit ? Number(res.normPerUnit) : null;
                            
                            const rawType = (res.resourceType || '').toLowerCase();
                            let resType = 'material';
                            let typeLabel = 'Мат';
                            let typeBg = '#eef2ff';
                            let typeColor = '#312e81';
                            let nameColor = '#312e81';
                            if (rawType.includes('labor') || rawType === 'labor') {
                              resType = 'labor';
                              typeLabel = 'Труд';
                              typeBg = '#faf5ff';
                              typeColor = '#6b21a8';
                              nameColor = '#6b21a8';
                            } else if (rawType.includes('equipment') || rawType === 'equipment') {
                              resType = 'equipment';
                              typeLabel = 'Мех';
                              typeBg = '#fff7ed';
                              typeColor = '#9a3412';
                              nameColor = '#000';
                            }
                            
                            return `
                              <div class="wt-res-row">
                                <span style="display:flex; align-items:center; justify-content:center;"><input type="checkbox" class="res-cb" data-wt-id="${wt.id}"></span>
                                <div class="res-wt-no">${resNo}.</div>
                                <span class="res-code-pill" title="${resCode}">${resCode}</span>
                                <div style="display:flex; align-items:center; gap:6px; min-width:0;">
                                  <span style="min-width:36px; background:${typeBg}; color:${typeColor}; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:600; text-align:center; flex-shrink:0;">${typeLabel}</span>
                                  <span class="res-name" style="color:${nameColor};" title="${resName}">${resName}</span>
                                </div>
                                <span class="res-norm" title="Норма на ед.">${normPerUnit !== null ? formatMoney(normPerUnit).replace(/\s[^\s]+$/, '') : ''}</span>
                                <span class="res-qty">${qty || ''}</span>
                                <span class="res-unit">${unitRes}</span>
                                <span class="res-sum">${resTotal ? formatMoney(resTotal) : ''}</span>
                              </div>
                            `;
                          }).join('')}
                        </div>
                      ` : ''}
                    </div>
                  `;
          }).join('');

          const isAllUsed = stage.wts.every(wt => usedWorkTypeIds.has(wt.id));

          html += `
                  <div class="tree-stage">
                      <div class="tree-stage-header">
                          <div class="stage-check-cell">
                            <input type="checkbox" class="stage-cb" data-stage-id="${stage.id}" ${isAllUsed ? 'disabled' : ''}>
                          </div>
                          <div class="stage-name-cell">
                            <strong ${isAllUsed ? 'style="opacity:0.5;"' : ''}>${escapeHtml(stage.name)}</strong>
                          </div>
                      </div>
                          <div class="tree-wt-list" id="wt-list-${stage.id}">
                            ${wtItems}
                          </div>
                  </div>
              `;
        });

        container.innerHTML = html || '<div class="muted" style="padding:12px; text-align:center;">Нет видов работ</div>';

        // Bind Events
        bindTreeEvents(container, estimateId, estimateName, blockName);
        updateStageCheckboxes(container);
      }

      function bindTreeEvents(container, estimateId, estimateName, blockName) {
        const handleWorkTypeChange = (cb, notifyStage = true) => {
          const wtId = cb.value;
          if (cb.checked) {
            selectedWorkTypes.set(wtId, {
              id: wtId,
              name: cb.dataset.name,
              stageId: cb.dataset.stageId,
              stageName: cb.dataset.stageName,
              estimateId: estimateId,
              estimateName: estimateName,
              blockId: activeBlockId,
              blockName: blockName,
              unit: cb.dataset.unit,
              volume: cb.dataset.volume,
              unitCost: cb.dataset.unitCost,
              totalCost: cb.dataset.totalCost,
              code: cb.dataset.code,
              cipher: cb.dataset.cipher
            });
          } else {
            selectedWorkTypes.delete(wtId);
          }
          if (notifyStage) {
            updateStageCheckboxes(container);
          }
        };

        container.querySelectorAll('.wt-cb').forEach(cb => {
          cb.addEventListener('change', () => {
            const wtId = cb.value;
            const wtRow = cb.closest('.tree-wt-row');
            
            // Toggle all resource checkboxes for this work type
            if (wtRow) {
              const resourceCheckboxes = wtRow.querySelectorAll(`.res-cb[data-wt-id="${wtId}"]`);
              resourceCheckboxes.forEach(resCb => {
                resCb.checked = cb.checked;
              });
            }
            
            handleWorkTypeChange(cb);
            updateSelectedTotal();
          });
        });

        container.querySelectorAll('.stage-cb').forEach(stageCb => {
          stageCb.addEventListener('change', () => {
            const stageRow = stageCb.closest('.tree-stage');
            if (!stageRow) return;
            const wtList = stageRow.querySelector('.tree-wt-list');
            if (!wtList) return;

            const stageChecked = stageCb.checked;
            wtList.querySelectorAll('.wt-cb:not(:disabled)').forEach(wtCb => {
              if (wtCb.checked !== stageChecked) {
                wtCb.checked = stageChecked;
                handleWorkTypeChange(wtCb, false);
              }
            });

            updateStageCheckboxes(container);
            updateSelectedTotal();
          });
        });
      }

      function updateSelectedTotal() {
        const sumDisplay = document.getElementById('new-lot-total-sum');
        if (!sumDisplay) return;

        let total = 0;
        selectedWorkTypes.forEach(wt => {
          total += parseFloat(wt.totalCost) || 0;
        });

        sumDisplay.textContent = `Итого: ${formatMoney(total)}`;
      }

      function updateStageCheckboxes(container) {
        container.querySelectorAll('.tree-wt-list').forEach(list => {
          const stageId = list.id.replace('wt-list-', '');
          const stageCb = container.querySelector(`.stage-cb[data-stage-id="${stageId}"]`);
          if (!stageCb) return;

          const all = list.querySelectorAll('.wt-cb:not(:disabled)');
          const checked = list.querySelectorAll('.wt-cb:not(:disabled):checked');

          if (all.length === 0) {
            // If all are disabled, the state depends on nothing (already handled by disabling stageCb)
            return;
          }

          stageCb.checked = (all.length === checked.length);
          stageCb.indeterminate = (checked.length > 0 && checked.length < all.length);
        });
      }

      // Save Handler
      document.getElementById('btn-create-lot-save').addEventListener('click', async () => {
        if (selectedWorkTypes.size === 0) {
          alert("Выберите хотя бы один вид работ");
          return;
        }

        const deadline = document.getElementById("new-lot-deadline").value;
        const manualTitle = document.getElementById("new-lot-name").value.trim();

        if (!manualTitle) {
          alert("Введите название лота");
          document.getElementById("new-lot-name").focus();
          return;
        }

        // Generate Title & Description
        // Group by Block -> Estimate -> Stage
        const items = Array.from(selectedWorkTypes.values());

        // Simple title generation
        const uniqueBlocks = [...new Set(items.map(i => i.blockName))];
        const uniqueStages = [...new Set(items.map(i => i.stageName))];

        const autoTitle = `${uniqueStages[0]}${uniqueStages.length > 1 ? ' и др.' : ''} (${uniqueBlocks.join(', ')})`;
        const finalTitle = manualTitle || autoTitle;
        let description = items.map(i => i.name).join(', ');
        if (description.length > 100) description = description.substring(0, 100) + '...';

        try {
          // Prepare items for backend
          const itemsPayload = items.map(i => ({
            workTypeId: i.id, // Save the original ID for tracking
            blockName: i.blockName,
            estimateName: i.estimateName,
            stageName: i.stageName,
            section: i.stageName, // Keep for backward compatibility
            itemCode: i.code || i.cipher || i.article || i.number || i.itemCode || null,
            cipher: i.cipher || null,
            name: i.name,
            unit: i.unit || "ед.", // Use selected unit
            quantity: parseFloat(i.volume) || 1, // Use selected volume/quantity
            volume: i.volume || "—",
            totalCost: parseFloat(i.totalCost) || 0,
            unitCost: parseFloat(i.unitCost) || 0
          }));

          // Call API to create tender
          await apiCreateTender({
            name: finalTitle,
            description: description,
            startDate: new Date().toISOString(),
            deadline: deadline,
            blockIds: uniqueBlocks,
            sectionIds: [],
            items: itemsPayload // Send items to backend
          });

          closeModal();
          await loadTenders(); // Reload from server
        } catch (error) {
          console.error('Failed to create tender:', error);
          alert('Ошибка при создании лота: ' + error.message);
        }
      });
    };

    function getRatingPoints(ratingBase) {
      if (!ratingBase) return 0;
      const ratingMap = {
        'AAA': 5.0, 'AA': 4.6, 'A': 4.2,
        'BBB': 3.8, 'BB': 3.4, 'B': 3.0,
        'CCC': 2.6, 'CC': 2.2, 'C': 1.8,
        'DDD': 1.4, 'DD': 1.0, 'D': 0.6
      };
      let cleanRating = ratingBase.replace('+', '').trim();
      let pts = ratingMap[cleanRating] || 0;
      if (ratingBase.includes('+')) pts += 0.2;
      return parseFloat(Math.min(5.0, pts).toFixed(1));
    }

    // ===========================================
    // API Integration Functions
    // ===========================================

    function calculateBidScore(bid, allBids, targetDeadline) {
      // 1. mc.uz Rating (max 5.0 points)
      let score = getRatingPoints(bid.subcontractor?.rating || bid.rating);

      // 2. Documents (max 2.0 points)
      // +0.5 each for License, Certificate, MTB, TR
      if (bid.subcontractor?.certificatePhoto || bid.certificatePhoto) score += 0.5;
      if (bid.subcontractor?.licensePhoto || bid.licensePhoto) score += 0.5;
      if (bid.subcontractor?.mtbPhoto || bid.mtbPhoto) score += 0.5;
      if (bid.subcontractor?.trPhoto || bid.trPhoto) score += 0.5;

      // 3. Price Competitiveness (max 2.0 points)
      // Lower price is better. Comparison with other bids.
      if (allBids && allBids.length > 0) {
        const prices = allBids.map(b => b.priceTotal).filter(p => p > 0);
        const minPrice = prices.length ? Math.min(...prices) : 0;
        const maxPrice = prices.length ? Math.max(...prices) : 0;

        if (maxPrice > minPrice && bid.priceTotal > 0) {
          // If multiple bids, lowest gets full 2.0, highest gets 0
          score += 2.0 * (1 - (bid.priceTotal - minPrice) / (maxPrice - minPrice));
        } else if (bid.priceTotal > 0) {
          // If only one bid or all same, full 2.0 points
          score += 2.0;
        }
      }

      // 4. Deadline Competitiveness (max 1.0 point)
      // Sooner date is better. Comparison with target lot deadline.
      if (targetDeadline && bid.completionDate) {
        const target = new Date(targetDeadline);
        const bidDate = new Date(bid.completionDate);
        if (!isNaN(target.getTime()) && !isNaN(bidDate.getTime())) {
          // If bid is before or on target, full points (1.0)
          if (bidDate <= target) {
            score += 1.0;
          } else {
            // If bid is after target, deduct 0.1 per day delay, min 0
            const dayDiff = Math.ceil((bidDate - target) / (1000 * 60 * 60 * 24));
            score += Math.max(0, 1.0 - (dayDiff * 0.1));
          }
        }
      } else {
        // Flat small bonus if no deadline data provided
        score += 0.3;
      }

      return parseFloat(Math.min(10, score).toFixed(1));
    }

    /**
     * Загрузить тендеры с сервера
     */
    async function loadTenders() {
      try {
        const projectId = getCurrentProjectId();
        if (!projectId) {
          console.warn('Tender view: projectId отсутствует — лоты не загружены');
          lots = [];
          renderLots();
          return;
        }

        const payload = await apiGetTenders(projectId);
        const tenders = Array.isArray(payload)
          ? payload
          : Array.isArray(payload?.data)
            ? payload.data
            : [];

        if (tenders && tenders.length > 0 && tenders[0].project) {
          PROJECT_CURRENCY = tenders[0].project.currency || 'UZS';
        }

        // Преобразуем данные с сервера в формат для UI
        lots = tenders.map((tender, index) => {
          const blockIds = JSON.parse(tender.blockIds || '[]');
          const sectionIds = JSON.parse(tender.sectionIds || '[]');
          const tenderItems = JSON.parse(tender.items || '[]');

          // Generate Display ID based on order (assuming sorted by newest first)
          // Total count is tenders.length. Newest is index 0.
          // ID = Total - index
          const displayIdNumber = tenders.length - index;
          const displayId = `LOT-${String(displayIdNumber).padStart(3, '0')}`;

          // Преобразуем bids в uploads
          const bidUploads = tender.bids.map(bid => {
            const items = JSON.parse(bid.items || '[]');
            const files = JSON.parse(bid.files || '[]');

            return {
              uploadId: bid.id,
              subcontractor: bid.subcontractor.company,
              coverage: `${blockIds.join(', ')}: ${sectionIds.join(', ')}`,
              status: bid.status,
              files: files,
              total: bid.priceTotal,
              score: calculateBidScore(bid, tender.bids, tender.deadline),
              completionDate: bid.completionDate,
              contractNumber: bid.contractNumber,
              items: items,
              ratingPoints: getRatingPoints(bid.subcontractor?.rating),
              rating: bid.subcontractor?.rating || null,
              certificatePhoto: bid.certificatePhoto || bid.subcontractor?.certificatePhoto || null,
              licensePhoto: bid.licensePhoto || bid.subcontractor?.licensePhoto || null,
              mtbPhoto: bid.mtbPhoto || bid.subcontractor?.mtbPhoto || null,
              trPhoto: bid.trPhoto || bid.subcontractor?.trPhoto || null,
              inn: bid.subcontractor?.inn || null,
              subcontractorId: bid.subcontractor?.id,
              errors: [],
              blocked: bid.blocked,
              blockReason: bid.blockReason,
              blockDate: bid.blockDate,
              inviteCode: bid.invite?.inviteCode,
              _rawData: bid
            };
          });

          // Преобразуем invites в uploads (для тех, кто еще не подал оффер)
          // Фильтруем те, у которых уже есть bid (они попадут в bidUploads)
          const inviteUploads = (tender.invites || [])
            .filter(invite => !invite.bid)
            .map(invite => {
              // Calculate a "potential" score for invited subcontractors based on their rating and docs
              const potentialScore = calculateBidScore({
                subcontractor: invite.subcontractor,
                priceTotal: 0,
                completionDate: null
              }, tender.bids, tender.deadline);

              const inviteStatus = !invite.status || invite.status === 'pending' ? 'invited' : invite.status;

              return {
                uploadId: `invite-${invite.id}`,
                subcontractor: invite.subcontractor.company,
                coverage: `${blockIds.join(', ')}: ${sectionIds.join(', ')}`,
                status: inviteStatus,
                files: [],
                total: null,
                score: potentialScore,
                completionDate: null,
                contractNumber: null,
                items: [],
                ratingPoints: getRatingPoints(invite.subcontractor?.rating),
                rating: invite.subcontractor?.rating || null,
                certificatePhoto: invite.subcontractor?.certificatePhoto || null,
                licensePhoto: invite.subcontractor?.licensePhoto || null,
                mtbPhoto: invite.subcontractor?.mtbPhoto || null,
                trPhoto: invite.subcontractor?.trPhoto || null,
                inn: invite.subcontractor?.inn || null,
                subcontractorId: invite.subcontractor?.id,
                errors: [],
                blocked: false,
                blockReason: null,
                blockDate: null,
                inviteCode: invite.inviteCode,
                _rawData: invite
              };
            });

          const uploads = [...bidUploads, ...inviteUploads];

          return {
            id: displayId, // Use generated ID for display
            objectName: tender.project?.name || 'Проект',
            title: tender.name,
            startDate: new Date(tender.startDate).toISOString().split('T')[0],
            status: tender.status,
            deadline: new Date(tender.deadline).toISOString().split('T')[0],
            allowAllBlocks: true,
            allowAllSections: true,
            blocks: blockIds,
            sections: sectionIds,
            items: tenderItems, // Store items
            invites: tender.invites?.length || 0,
            uploads: uploads,
            _rawData: tender // Сохраняем оригинальные данные
          };
        });

        renderLots();
      } catch (error) {
        console.error('Failed to load tenders:', error);
        alert('Не удалось загрузить тендеры. Используются демо-данные.');
      }
    }

    renderObjects();
    // renderLots(); // Закомментируем, чтобы не было двойного рендера
    loadTenders(); // Загружаем данные с сервера
  </script>
